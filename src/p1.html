<title>除雪管理アプリ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: 現場で片手で使う前提のスマホアプリ。参考アプリに合わせ、深緑を基調に白いカード・丸いボタン・下部タブ(PCでは左のサイドバー)。
   緊急度は色付きの帯と文字ラベルの両方で示し、押す場所は48px以上の高さにそろえる。常に明るい配色で表示する。 */
:root{
  --bg:#F8F9F8; --surface:#ffffff; --surface2:#F3F5F4; --ink:#20241F; --muted:#5C6459; --line:#E3E7E5;
  --accent:#1E8449; --accent-hover:#187038; --accent-ink:#ffffff; --accent-soft:#E2F1E7; --brand:#175C40; --brand-active:#2C8358;
  --crit:#C1443C; --crit-bg:#F8E1DE; --warn:#9A6A0B; --warn-bg:#F6EACB; --ok:#1E6B45; --ok-bg:#E2F1E7;
  --idle:#5C6459; --idle-bg:#EAEEEC; --info:#2F6FA8; --info-bg:#DEEAF3; --track:#E3E9E6;
  --shadow:0 1px 2px rgba(20,30,22,.05),0 6px 16px -10px rgba(20,30,22,.18);
  --font-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --font-head:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;padding:0 0 92px}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--font-head);font-weight:700;text-wrap:balance}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:.9rem}
.err{color:var(--crit);font-size:.9rem}
.page{max-width:760px;margin-inline:auto;padding:16px}
.page.wide{max-width:1120px}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.appbar h1{font-size:1.1rem;line-height:1.2;color:var(--brand);display:flex;align-items:center;gap:8px}
.appbar h1 img{height:30px;width:auto;max-width:120px;object-fit:contain;display:block}
.appbar .sub{font-size:.8rem;color:var(--muted)}
.ab-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;min-height:44px;padding:6px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.ab-btn:hover{background:var(--surface2)}
.ab-btn[disabled]{opacity:.5;cursor:default}
#btnRefresh::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.ico{width:24px;height:24px;flex:none}

/* tab bar + fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:2px;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px -8px rgba(0,0,0,.18)}
.tabbar button{flex:1;border:0;background:transparent;cursor:pointer;min-height:56px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:.75rem;font-weight:700;border-radius:10px}
.tabbar button .ico{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:24;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-height:52px;padding:0 22px;font-weight:700;display:inline-flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 16px -4px rgba(20,60,35,.45)}
.fab:hover{background:var(--accent-hover)}
.fab .ico{width:22px;height:22px}

/* buttons / forms */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;cursor:pointer;min-height:48px;font-weight:700}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{min-height:40px;padding:4px 12px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:default}
.link{border:0;background:none;color:var(--info);cursor:pointer;padding:8px 0;text-decoration:underline;font-size:.9rem;min-height:40px}
.linka{color:var(--info);font-size:.9rem;padding:8px 4px;display:inline-block}
.f label,.fields label{display:block;font-size:.9rem;color:var(--muted);min-width:0}
.f input:not([type=checkbox]),.f select,.f textarea,.fields input:not([type=checkbox]),.fields select,.bar input,.bar select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin-top:4px;min-height:48px}
.f textarea{min-height:96px;resize:vertical}
.f .grp{display:flex;flex-direction:column;gap:14px}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f .help,.fields .help{display:block;font-size:.82rem;color:var(--muted);margin-top:4px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tg{position:relative}
.tg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.tg span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-size:.95rem}
.tg input:checked+span{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
.tg input:focus-visible+span{outline:3px solid var(--info);outline-offset:2px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.f .chk,.chk{display:flex;align-items:center;gap:10px;min-height:48px;color:var(--ink);font-size:1rem}

/* badges */
.pill{flex:none;font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.big{font-size:1rem;padding:4px 14px}
.pill.l3{background:var(--crit);color:var(--surface)} .pill.l2{background:var(--warn);color:var(--surface)}
.pill.l1{background:var(--ok-bg);color:var(--ok)} .pill.l0{background:var(--idle-bg);color:var(--idle)}
.tag{display:inline-block;background:var(--idle-bg);color:var(--idle);border-radius:6px;padding:1px 8px;font-size:.82rem}
.tag.ice{background:var(--warn-bg);color:var(--warn);font-weight:700}
.alerts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.alerts span{background:var(--crit-bg);color:var(--crit);border-radius:6px;padding:2px 8px;font-size:.85rem;font-weight:700}
.alerts span.tag{background:var(--idle-bg);color:var(--idle);font-weight:400}
.alerts span.tag.ice{background:var(--warn-bg);color:var(--warn);font-weight:700}

/* home */
.hello{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hello .d{font-size:1.4rem;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.tile{box-shadow:var(--shadow)}
.tile .n{font-family:var(--font-num);font-size:2.1rem;font-weight:600;line-height:1.15}
.tile .l{font-size:.95rem;color:var(--muted)}
.tile.c3 .n{color:var(--crit)} .tile.c2 .n{color:var(--warn)} .tile.c1 .n{color:var(--ok)}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:24px 0 10px}
.sec h2{font-size:1.1rem}
.sec .gc{font-size:.95rem;color:var(--muted);font-weight:400;margin-left:6px}
.stack{display:flex;flex-direction:column;gap:10px}
.grp-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:700;font-size:1rem}
.grp-h:first-child{margin-top:4px}
.grp-h::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--idle)}
.grp-h.l3::before{background:var(--crit)}.grp-h.l2::before{background:var(--warn)}.grp-h.l1::before{background:var(--accent)}
.grp-h .gc{color:var(--muted);font-weight:400;font-size:.92rem}
.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:5;background:var(--bg);padding:6px 0;margin-top:0}
@media (min-width:900px){#siteList.cols{display:block}#siteList .stack{display:grid;grid-template-columns:1fr 1fr;gap:12px}#v-sites.page{max-width:1000px}}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.92rem}

/* site card */
.mvb{display:flex;gap:6px;justify-content:flex-end;grid-column:1/-1}
.sc>.mvb{padding:0 10px 10px}
.mvb button{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer}
.mvb button:disabled{opacity:.35;cursor:default}
.sc{position:relative;box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sc.l3{border-color:var(--crit);box-shadow:inset 6px 0 0 var(--crit)}
.sc.l2{box-shadow:inset 6px 0 0 var(--warn)}
.sc-main{padding:12px 14px 8px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sc-name{font-size:1.1rem;font-weight:700;line-height:1.35;overflow-wrap:anywhere;min-width:0}
.sc-sub{color:var(--muted);font-size:.9rem}
.sc-st{padding:0 14px 12px 18px}
.sc-st .mt{font-size:.82rem;color:var(--muted);margin-top:4px}

.sc .seg button{min-height:44px}
.sc .alerts{margin-top:2px}
.wb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:6px 14px;align-items:center;margin-top:4px}
.wb-w{display:flex;align-items:center;gap:8px;min-width:0}
.wb-w svg{width:34px;height:34px;flex:none;color:var(--info)}
.wb-w .t{font-size:1.5rem;font-weight:600;line-height:1.1}
.wb-w .t small{font-size:.85rem;font-weight:400;margin-left:2px}
.wb-w .w{font-size:.9rem}
.sn{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:.92rem}
.track{height:10px;background:var(--track);border-radius:6px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--info)}
.fill.hot{background:var(--crit)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 4px;cursor:pointer;min-height:48px;border-left:1px solid var(--line);font-size:.95rem}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--idle-bg);color:var(--ink);font-weight:700}
.seg button[aria-pressed="true"].prep{background:var(--warn-bg);color:var(--warn);font-weight:700}
.seg button[aria-pressed="true"].out{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"].done{background:var(--info-bg);color:var(--info)}
.seg button[disabled]{cursor:default;opacity:.6}

/* toolbars / chips */
.bar{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.bar .r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar .r21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer;white-space:nowrap}
.chips button .num{margin-left:6px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
.chips button[aria-pressed="true"] .num{color:inherit}

/* cards: report / note / info */
.card2{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.lab2{font-size:.88rem;color:var(--muted);margin-bottom:6px}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.rc .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rc .nm{font-weight:700;overflow-wrap:anywhere}
.rc .tm{font-family:var(--font-num);font-size:.9rem;color:var(--muted);white-space:nowrap}
.rc .ln{font-size:.9rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.dgrp{margin:20px 0 8px;font-weight:700;font-size:1rem}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.note .hd{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.note .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.dl{display:grid;grid-template-columns:7em minmax(0,1fr);gap:8px 12px;margin:0}
.dl dt{color:var(--muted);font-size:.9rem}
.dl dd{margin:0;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface2);border-radius:10px;padding:8px 10px;min-width:0}
.kv small{display:block;color:var(--muted);font-size:.82rem}
.kv b{font-family:var(--font-num);font-weight:600;font-size:.95rem}
.fc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fc>div{border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:.82rem;min-width:0;background:var(--surface)}
.fc svg{width:24px;height:24px;color:var(--info)}
.fc .d{color:var(--muted)}
.fc .tt{font-family:var(--font-num);font-size:.82rem}
.fc .s{font-weight:700}
.bignow{display:flex;align-items:center;gap:14px}
.bignow svg{width:54px;height:54px;color:var(--info);flex:none}
.bignow .t{font-family:var(--font-num);font-size:2.6rem;font-weight:600;line-height:1}
.bignow .t small{font-size:1rem;font-weight:400}
.bignow .w{font-size:1.05rem}

/* photos */
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph>button,.phb{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;overflow:hidden;padding:0;background:var(--surface2);cursor:pointer;max-width:100%}
.ph img,.phb img{width:100%;height:100%;object-fit:cover;display:block}
.pk{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.62);color:#fff;border-radius:6px;padding:0 6px;font-size:.75rem}
.px{position:absolute;right:4px;top:4px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:1.2rem;cursor:pointer;line-height:1}
.ph-load{display:flex;align-items:center;justify-content:center;color:var(--muted)}

.adm-badge{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;line-height:1;padding:3px 8px;border-radius:999px;background:#FBEBC8;color:#7A4E00;white-space:nowrap;vertical-align:middle;margin-left:6px}
.adm-badge .lk{width:11px;height:11px}
.tile.money,.srow.money{border:1.5px dashed #D9A93E;background:#FFFBF0}
.f label .adm-badge{margin-left:8px}
/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sheet.s2{z-index:50}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.sheet-bar h2{color:var(--brand);flex:1;font-size:1.05rem;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.sheet-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.sheet-foot .btn{flex:1}
[hidden]{display:none!important}
.lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:16px}
.lb img{max-width:100%;max-height:82vh;border-radius:8px}
.lb .lbb{position:absolute;border:0;background:rgba(255,255,255,.18);color:#fff;width:52px;height:52px;border-radius:50%;font-size:1.4rem;cursor:pointer}
.lb .x{top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.lb .pv{left:8px;top:50%}.lb .nx{right:8px;top:50%}
.lb .cap{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-size:.9rem}
.toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--surface);border-radius:12px;padding:12px 16px;text-align:center;max-width:520px;margin-inline:auto}

/* stats */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
.mnav .lbl{font-weight:700;font-size:1.1rem;text-align:center;flex:1}
.mnav .btn{min-width:52px;padding:8px}
.vt{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vt button{border:0;background:var(--surface);min-height:46px;cursor:pointer}
.vt button+button{border-left:1px solid var(--line)}
.vt button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.srow .nm{font-weight:700;overflow-wrap:anywhere}
.srow .amt{font-family:var(--font-num);font-weight:600;text-align:right}
.srow .sb{color:var(--muted);font-size:.88rem}
.srow .sb.r{text-align:right}

/* admin */
.admhead{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.admh1{font-size:1.25rem}
.admhead .adm-badge{margin-left:0}
.subtabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin:6px 0 14px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--bg);z-index:6;padding-top:4px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{border:0;background:none;cursor:pointer;padding:0 16px;min-height:48px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;flex:0 0 auto;border-radius:0}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.admdesc{font-size:.88rem;color:var(--muted);margin:0 0 14px;line-height:1.7}
.ah{font-size:1rem;border-left:4px solid var(--accent);padding-left:10px;margin:24px 0 10px}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ahead .ah{margin-block:24px 10px}
.form-row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);align-items:start}
.form-row:last-child{border-bottom:0}
.form-row>label{font-weight:700;font-size:.92rem;color:var(--ink);padding-top:12px}
.form-row .help{display:block;font-size:.82rem;color:var(--muted);margin-top:6px}
.form-row input,.form-row select{max-width:320px}
@media(max-width:700px){.form-row{grid-template-columns:1fr;gap:4px;padding:14px 16px}.form-row>label{padding-top:0}.form-row input,.form-row select{max-width:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px;max-width:760px}
#adm-sites .panel{max-width:none}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:1100px}
